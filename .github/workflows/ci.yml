name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep the real-provider opt-ins explicitly disabled in every standard job.
  RUN_LLM_INTEGRATION_TESTS: "0"
  AGENT_BENCHMARK_LIVE_YES: "0"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          readonly version=0.10.0
          readonly sha256=6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
          readonly archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "/tmp/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "$sha256" "/tmp/${archive}" | sha256sum --check --status
          tar --extract --xz --file "/tmp/${archive}" --directory /tmp
          sudo install --mode=0755 "/tmp/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck

      - name: Install actionlint
        run: |
          set -euo pipefail
          readonly version=1.7.12
          readonly sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          readonly archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "$sha256" "/tmp/${archive}" | sha256sum --check --status
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp actionlint
          sudo install --mode=0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: Check Bash syntax
        run: |
          set -euo pipefail
          find bin scripts lib tests -type f \
            \( -name '*.sh' \
               -o -path 'tests/fixtures/mock-dsh/dsh' \
               -o -path 'tests/fixtures/mock-curl/curl' \
               -o -path 'tests/fixtures/mock-graphify/graphify' \) \
            -print0 | xargs -0 -r bash -n

      - name: Run ShellCheck
        run: |
          set -euo pipefail
          shellcheck -x -S warning \
            bin/agent \
            scripts/*.sh \
            lib/*.sh \
            tests/unit/*.sh \
            tests/integration/run.sh \
            tests/fixtures/mock-dsh/dsh \
            tests/fixtures/mock-curl/curl \
            tests/fixtures/mock-graphify/graphify

      - name: Check Node module syntax
        run: |
          set -euo pipefail
          find lib tests -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check

      - name: Check patch whitespace
        run: git diff --check

      - name: Lint GitHub Actions workflows
        run: actionlint .github/workflows/ci.yml

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
      - name: Run deterministic unit suite
        run: bash tests/unit/run.sh

  benchmark-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
      - name: Run offline benchmark with isolated state
        run: |
          set -euo pipefail
          ci_state="$(mktemp -d)"
          trap 'rm -rf "$ci_state"' EXIT
          AGENT_STATE_HOME="$ci_state" bash bin/agent benchmark --offline
